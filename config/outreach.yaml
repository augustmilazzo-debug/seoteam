offer:
  company: Provahaus
  url: https://provahaus.com/
  # What we do, in the owner's words. Every email must stay true to this.
  summary: >
    We help med spas get more patients for the specific services they want to
    grow. The med spa tells us which service they want more clients for; we
    maximize their visibility on Google for that service, then run ads to a
    dedicated landing page to generate new inquiries.
  # Never claim results, client names, prices or guarantees not listed here.
  proof_points: []
  call_to_action: >
    Ask if they'd be open to a short call, or simply which one service they'd
    most like more patients for.

